# BookNest fail2ban 配置
# 使用方式: 复制此文件到 /etc/fail2ban/jail.local
# 然后: sudo systemctl enable fail2ban && sudo systemctl start fail2ban

[DEFAULT]
# 封禁时间: 1 小时
bantime = 3600

# 检测时间窗口: 10 分钟
findtime = 600

# 最大失败次数
maxretry = 3

# 封禁动作
banaction = iptables-multiport

# 忽略本地 IP
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
port = ssh
filter = sshd
logpath = /var/log/auth.log
maxretry = 3
bantime = 7200

[nginx-http-auth]
enabled = true
filter = nginx-http-auth
port = http,https
logpath = /var/log/nginx/error.log
maxretry = 5
bantime = 3600

[nginx-botsearch]
enabled = true
port = http,https
filter = nginx-botsearch
logpath = /var/log/nginx/access.log
maxretry = 5
bantime = 3600

[nginx-limit-req]
enabled = true
port = http,https
filter = nginx-limit-req
logpath = /var/log/nginx/error.log
maxretry = 10
bantime = 3600
