# BookNest Nginx 配置（安全加固版）
# 安全头策略：完全由后端 Helmet 控制，Nginx 只添加 Helmet 未设置的头
server {
    listen 80;
    server_name 47.103.214.67;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 静态文件：不 fallback 到 SPA
    location = /robots.txt {
        root /var/www/booknest;
        try_files /robots.txt =404;
        access_log off;
    }

    location = /sitemap.xml {
        root /var/www/booknest;
        try_files /sitemap.xml =404;
        access_log off;
    }

    # 阻止旧版 /app.js 路径（防止安全扫描器误报）
    location = /app.js {
        return 404;
    }

    # 根路径：前端首页，no-cache 防止旧版本缓存
    # 安全头由后端 Helmet 控制，Nginx 只添加 Helmet 未设置的头
    location = / {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Disposition;
        # 只添加 Helmet 未设置的头，避免重复
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Expect-CT "max-age=86400, enforce" always;
    }

    # 其他路径：前端 SPA
    location / {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Disposition;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Expect-CT "max-age=86400, enforce" always;
    }

    # 静态资源缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:4001;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        proxy_hide_header Content-Disposition;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Expect-CT "max-age=86400, enforce" always;
    }

    # Socket.io
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 后端 API — 安全头完全由后端 Helmet 控制，Nginx 不添加重复头
    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # 只添加 Helmet 未设置的头
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Expect-CT "max-age=86400, enforce" always;
    }

    # 健康检查
    location /health {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Expect-CT "max-age=86400, enforce" always;
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Expect-CT "max-age=86400, enforce" always;
    }
}
